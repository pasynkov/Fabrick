name: CD Proposal Create

on:
  issues:
    types: [labeled]

concurrency:
  group: proposal-pipeline-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event.label.name == 'proposal:ready'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install openspec
        run: npm install -g @fission-ai/openspec

      - name: Run proposal pipeline
        uses: anthropics/claude-code-base-action@beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-4-7
          timeout_minutes: 45
          allowed_tools: "Agent,Bash,Read,Write,Edit,Skill,Glob,LS"
          settings: |
            {
              "permissions": {
                "allow": ["Bash(*)", "Read(*)", "Write(*)", "Edit(*)", "Glob(*)", "LS(*)"],
                "deny": []
              }
            }
          prompt: |
            Invoke the Skill tool with skill="cd-proposal-pipeline" and args="${{ github.repository }} ${{ github.event.issue.number }}".

            The skill orchestrates the end-to-end proposal pipeline from issue thread fetch through opened PRs. Follow the skill's instructions exactly. Do not deviate from the six-step contract.

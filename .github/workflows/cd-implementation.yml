name: CD Implementation

on:
  push:
    branches: ['implementation/**']
  workflow_dispatch:

concurrency:
  group: implementation-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: fabrick
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_TEST_NAME: fabrick_test
      DB_SSL: 'false'
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fabrick_test
          POSTGRES_USER: fabrick
          POSTGRES_PASSWORD: ${{ secrets.DB_PASS }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install openspec
        run: npm install -g @fission-ai/openspec

      - name: Install backend root deps
        run: npm ci --legacy-peer-deps
        working-directory: applications/backend

      - name: Resolve change name from branch
        id: name
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          FULL_NAME="${BRANCH#implementation/}"
          NAME="$FULL_NAME"
          if [ ! -d "openspec/changes/$NAME" ]; then
            NAME_NO_ID=$(echo "$NAME" | sed 's/^[0-9]*-//')
            if [ -d "openspec/changes/$NAME_NO_ID" ]; then
              NAME="$NAME_NO_ID"
            fi
          fi
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "full_name=$FULL_NAME" >> $GITHUB_OUTPUT

      - name: Run implementation pipeline
        uses: anthropics/claude-code-base-action@beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-4-7
          timeout_minutes: 55
          allowed_tools: "Agent,Bash,Read,Write,Edit,Skill,Glob,LS"
          settings: |
            {
              "permissions": {
                "allow": ["Bash(*)", "Read(*)", "Write(*)", "Edit(*)", "Glob(*)", "LS(*)"],
                "deny": []
              }
            }
          prompt: |
            Invoke the Skill tool with skill="cd-implementation-pipeline" and args="${{ github.repository }} ${{ steps.name.outputs.name }}".

            The skill orchestrates the end-to-end implementation pipeline from this implementation/<name> branch through a feature/<name> branch with an open PR to develop. Follow the skill's instructions exactly. Do not deviate from the seven-step contract.

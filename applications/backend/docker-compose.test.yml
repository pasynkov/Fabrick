services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: fabrick
      POSTGRES_PASSWORD: fabrick
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabrick"]
      interval: 3s
      timeout: 5s
      retries: 10

  e2e:
    image: node:24-alpine
    working_dir: /backend
    volumes:
      - .:/backend
      - /backend/node_modules
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: fabrick
      DB_PASS: fabrick
      DB_TEST_NAME: fabrick_test
      DB_SSL: "false"
      JWT_SECRET: test-secret
    command: sh -c "npm ci --legacy-peer-deps && npx jest --config api/jest.e2e.config.js"
    depends_on:
      postgres:
        condition: service_healthy
